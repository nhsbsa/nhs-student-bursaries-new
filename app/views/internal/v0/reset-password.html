{% extends "layout-internal-signin.html" %}

{% set pageName = "Page templates" %}

{% block beforeContent %}
{% endblock %}

{% block content %}
  <div class="nhsuk-grid-row">

    <div class="nhsuk-grid-column-two-thirds">

      <h1 class="nhsuk-heading-l">Reset password</h1>

			<p id="reset-password-text">Enter your email address and we'll send you a password reset email.</p>

			<div class="nhsuk-form-group">
				<label class="nhsuk-label" id="email-label" for="email">Email address</label>
				<input class="nhsuk-input" id="email" name="email" type="text" autocomplete="on" />
			</div>

			<div class="nhsuk-form-group">
				<a href="reset-password-submitted" class="nhsuk-button" id="submitButton">Send</a>
				<p><a href="sign-in" id="cancelLink">Cancel</a></p>
			</div>

    </div>

  </div>
{% endblock %}
